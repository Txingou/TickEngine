name: build

# 设计口径（决策见 docs/0001 的 D16）：
#   push/PR  → 只构建、测试、打包并上传 artifact（不发版）
#   tag v*   → 校验 tag 与 csproj <Version> 一致 → 推 nuget.org（OIDC 可信发布）→ 建 GitHub Release
# 发布凭据：无任何长期密钥。nuget.org 的 Trusted Publishing 策略绑定
#   Repository Owner=Txingou / Repository=TickEngine / Workflow File=build.yml / Environment=production，
#   因此**发布 job 必须留在本文件里**、且必须声明 environment: production。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 发版运行不取消：tag 推上去就让它跑完
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  core:
    name: core / build + test + pack (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # 与 <TargetFramework>net8.0</TargetFramework> 对齐：发包用的 SDK 必须是钉住的
          dotnet-version: '8.0.x'
          # 不启用 setup-dotnet 的 NuGet 缓存：本仓库体量小、restore 只要十几秒，
          # 不值得为此再引入一个可能失败的缓存步骤。

      - name: Restore
        run: dotnet restore tests/TickEngine.Tests/TickEngine.Tests.csproj

      - name: Build core (Release)
        run: dotnet build src/TickEngine/TickEngine.csproj -c Release --no-restore

      - name: Test (xunit)
        run: dotnet test tests/TickEngine.Tests/TickEngine.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      # 失败用例直接变成 CI 注解：公开仓库的日志/artifact 需要登录才能看，注解匿名可读
      - name: Annotate test failures
        if: failure()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { "::warning::未找到 TRX 报告"; exit 0 }
          foreach ($f in $files) {
            [xml]$t = Get-Content $f.FullName
            foreach ($u in ($t.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })) {
              $msg = ("$($u.Output.ErrorInfo.Message) || $($u.Output.ErrorInfo.StackTrace)") -replace "`r?`n", ' '
              if ($msg.Length -gt 800) { $msg = $msg.Substring(0, 800) }
              "::error::$($u.testName) :: $msg"
            }
          }

      - name: Pack
        run: dotnet pack src/TickEngine/TickEngine.csproj -c Release --no-build -o artifacts

      - name: Verify package contents
        run: |
          set -euo pipefail
          nupkg=$(ls artifacts/TickEngine.*.nupkg)
          echo "package: $nupkg"
          unzip -Z1 "$nupkg" | sort
          for f in TickEngine.nuspec README.md LICENSE lib/net8.0/TickEngine.dll lib/net8.0/TickEngine.xml; do
            unzip -Z1 "$nupkg" | grep -qx "$f" || { echo "::error::包里缺少 $f"; exit 1; }
          done
          lnupkg=$(ls artifacts/TickEngine.*.snupkg)
          unzip -Z1 "$lnupkg" | grep -qx 'lib/net8.0/TickEngine.pdb' || { echo "::error::符号包里缺少 PDB"; exit 1; }
          echo "PACKAGE_CONTENTS_OK"

      - name: Consumption smoke (引用打出来的包并编译运行)
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/TickEngine/TickEngine.csproj | head -n1)
          echo "packed version: $version"
          work=$(mktemp -d)
          dotnet new console -o "$work/Smoke" --framework net8.0 > /dev/null
          cd "$work/Smoke"
          dotnet add package TickEngine --version "$version" --source "$GITHUB_WORKSPACE/artifacts" > /dev/null
          cat > Program.cs <<'CS'
          using TickEngine;

          using var engine = new UpdateEngine();
          int ticks = 0;

          engine.Register(new CounterSystem(() => Interlocked.Increment(ref ticks)), Schedule.Worker(60, "smoke"));
          engine.Start();
          Thread.Sleep(500);
          engine.Stop();

          var views = engine.Systems;
          var v = views[0];
          Console.WriteLine($"ticks={ticks} groups={engine.GroupCount} systems={views.Count} " +
                            $"tickNumber={v.TickNumber} dropped={v.Dropped} faults={v.Faults} " +
                            $"actualFps={v.ActualFps:F1} elapsed={v.ElapsedSeconds:F2}");

          bool ok = ticks > 0 && engine.GroupCount == 1 && views.Count == 1 && v.TickNumber > 0 && v.Faults == 0;
          Console.WriteLine(ok ? "PACKAGE_SMOKE_OK" : "PACKAGE_SMOKE_FAILED");
          return ok ? 0 : 1;

          internal sealed class CounterSystem : UpdateSystem
          {
              private readonly Action _tick;
              public CounterSystem(Action tick) => _tick = tick;
              protected override void Update(in FrameContext frame) => _tick();
          }
          CS
          dotnet run -c Release

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TickEngine-nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
          retention-days: 7

      # 测试报告始终上传（含失败时）：公开仓库的 artifact 可匿名下载，失败诊断不必依赖登录
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: windows / full solution + smoke
    # 只在 push（含 tag）上跑，不在 PR 上跑：PR 噪音留给 ubuntu 作业
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build full solution (含 net8.0-windows 的 WinformDemo)
        run: dotnet build TickEngine.sln -c Release

      - name: Test (xunit)
        run: dotnet test tests/TickEngine.Tests/TickEngine.Tests.csproj -c Release --no-build --logger "trx;LogFileName=windows-tests.trx" --results-directory TestResults

      - name: Annotate test failures
        if: failure()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { "::warning::未找到 TRX 报告"; exit 0 }
          foreach ($f in $files) {
            [xml]$t = Get-Content $f.FullName
            foreach ($u in ($t.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })) {
              $msg = ("$($u.Output.ErrorInfo.Message) || $($u.Output.ErrorInfo.StackTrace)") -replace "`r?`n", ' '
              if ($msg.Length -gt 800) { $msg = $msg.Substring(0, 800) }
              "::error::$($u.testName) :: $msg"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Engine smoke (无窗口)
        shell: pwsh
        run: |
          dotnet run --project src/TickEngine.ConsoleDemo -c Release --no-build -- --smoke --seconds 3 --no-beatlog 2>&1 |
            Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) {
            "::error::Engine smoke 退出码 $LASTEXITCODE"
            Get-Content smoke.log | Select-Object -Last 30 | ForEach-Object { "::error::$_" }
            exit 1
          }

  publish:
    name: publish to nuget.org + GitHub Release
    needs: [core, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 必须与 nuget.org 可信发布策略里的 Environment 完全一致，否则 OIDC 换取临时 API Key 会失败
    environment: production
    permissions:
      id-token: write   # GitHub OIDC token（换取 nuget.org 临时 API Key）
      contents: write   # 建 GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches <Version> in TickEngine.csproj
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/TickEngine/TickEngine.csproj | head -n1)
          echo "tag=$tag csproj=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag 与 TickEngine.csproj 的 <Version>$version</Version> 不一致；请先把 csproj 版本改成 $tag 再打 tag"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack src/TickEngine/TickEngine.csproj -c Release -o artifacts

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org 的 profile 名（不是邮箱）；与可信发布策略的 owner 一致
          user: Mr.Ming

      - name: Push to nuget.org
        env:
          # 用 env 传递，避免 key 出现在命令行回显里
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -uo pipefail
          status=0
          for f in "artifacts/TickEngine.$VERSION.nupkg" "artifacts/TickEngine.$VERSION.snupkg"; do
            echo "pushing $f"
            if ! dotnet nuget push "$f" \
                   --api-key "$NUGET_KEY" \
                   --source https://api.nuget.org/v3/index.json \
                   --skip-duplicate 2>&1 | tee -a push.log; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::推送到 nuget.org 失败（公开仓库日志需登录，这里把输出打成注解）"
            tail -n 25 push.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "::notice::已推送 .nupkg 与 .snupkg 到 nuget.org"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          case "$VERSION" in
            *-*) pre="--prerelease" ;;
            *)   pre="" ;;
          esac
          if ! gh release create "$GITHUB_REF_NAME" \
                 "artifacts/TickEngine.$VERSION.nupkg" \
                 "artifacts/TickEngine.$VERSION.snupkg" \
                 --title "TickEngine $VERSION" \
                 --generate-notes $pre 2>&1 | tee release.log; then
            echo "::error::创建 GitHub Release 失败"
            tail -n 20 release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "::notice::已创建 GitHub Release $GITHUB_REF_NAME"

      # 推送成功 ≠ 立刻可在 nuget.org 上看到（索引有延迟）。这里从 runner（干净的 nuget.org 通路）
      # 轮询 flat-container 索引做一次如实核对：看到即确认，没看到只警告——包已经推上去了，
      # 绝不因为"索引慢"让一次成功的发布显示成失败。
      - name: Verify package is live on nuget.org
        run: |
          set -uo pipefail
          url="https://api.nuget.org/v3-flatcontainer/tickengine/index.json"
          for _ in $(seq 1 60); do
            body=$(curl -fsS "$url" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "\"$VERSION\""; then
              echo "::notice::nuget.org 索引里已出现 TickEngine $VERSION：$body"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::推送步骤已成功，但 10 分钟内没在 nuget.org 索引里看到 $VERSION（索引可能延迟，稍后自行确认；不要因此重发同版本号）"
          curl -sS -o /dev/null -w '::warning::flat-container 当前 HTTP %{http_code}\n' "$url" || true
